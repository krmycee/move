.head h1{font-family:'Ortaen',Archivo,system-ui,sans-serif!important;font-size:clamp(24px,3.6vw,52px)!important;font-weight:400!important;font-stretch:normal!important;letter-spacing:.01em!important}
.head{position:absolute;left:50%;top:clamp(18px,3.4vw,44px);transform:translateX(-50%);text-align:center;pointer-events:none;width:min(92vw,900px)}
.head h1{font-stretch:125%;font-weight:800;font-size:clamp(28px,4.6vw,64px);letter-spacing:-.01em;color:var(--lime);line-height:1;text-shadow:0 0 30px rgba(187,208,10,.25)}
.head p{margin-top:12px;font-size:clamp(12px,1.05vw,15px);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-stretch:110%}
.chips{position:absolute;left:50%;bottom:clamp(14px,3vh,34px);transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(96vw,1100px)}
.chip{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(10,14,24,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg);padding:9px 14px 9px 12px;border-radius:999px;font:inherit;font-size:13px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.chip b{font-weight:700;color:var(--lime);font-size:11px;letter-spacing:.08em}
.chip span{color:var(--mut);font-size:12px}
.chip:hover,.chip.on{border-color:var(--lime);background:rgba(187,208,10,.12);transform:translateY(-2px)}
.chip:focus-visible,.mk:focus-visible,.back:focus-visible,.enter:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(104px,14vh,130px);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(233,236,242,.35);pointer-events:none}
.marks{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
.marks.hide{opacity:0}
.mk{position:absolute;left:0;top:0;width:0;height:0;pointer-events:auto;border:0;background:none;cursor:pointer;transition:opacity .25s}
.mk .dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px 4px rgba(187,208,10,.65)}
.mk .ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(187,208,10,.85);animation:pulse 2.2s ease-out infinite}
.mk .ring.r2{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.6);opacity:0}}
.mk .lbl{position:absolute;left:20px;top:-15px;white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.02em;color:#fff;opacity:0;transform:translateX(-6px);transition:.25s;text-shadow:0 1px 8px #000;pointer-events:none}
.mk .lbl small{display:block;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.mk:hover .lbl,.mk.on .lbl{opacity:1;transform:none}
.mk.off{opacity:0;pointer-events:none}
.clouds{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.clouds img{position:absolute;left:50%;top:50%;width:150vw;height:150vh;object-fit:cover;opacity:0;will-change:transform,opacity;transform:translate(-50%,-50%)}
.clouds .veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,#8a95a6 0%,#6f7a8b 55%,#5d6778 100%);opacity:0;will-change:opacity}
.player{position:fixed;inset:0;z-index:4;background:#000;opacity:0;visibility:hidden}
.player.show{visibility:visible}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;will-change:transform}
.player video.cur{display:block}
.back{position:fixed;left:clamp(16px,2.4vw,32px);top:clamp(16px,2.4vw,32px);z-index:6;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(5,8,15,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,border-color .2s}
.back.show{opacity:1;pointer-events:auto}
.back:hover{border-color:var(--lime)}
.bar{position:fixed;left:0;bottom:0;height:3px;width:100%;z-index:6;background:rgba(255,255,255,.08);opacity:0;transition:opacity .4s}
.bar.show{opacity:1}
.bar i{display:block;height:100%;width:0;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at center,#0b1220,#05080f 70%);transition:opacity 1.1s ease,visibility 1.1s}
.intro.gone{opacity:0;visibility:hidden}
.intro .in{text-align:center;display:grid;justify-items:center;gap:18px}
.intro svg{width:120px;height:auto}
.intro h2{font-family:'Ortaen',Archivo,system-ui,sans-serif;font-weight:400;font-size:clamp(40px,7vw,96px);letter-spacing:.01em;line-height:1}
.intro p{color:var(--mut);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.enter{margin-top:14px;appearance:none;font:inherit;font-weight:700;font-stretch:115%;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:#05080f;background:var(--lime);border:0;border-radius:999px;padding:14px 30px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 0 0 rgba(187,208,10,0)}
.enter:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(187,208,10,.35)}
.enter[disabled]{opacity:.45;cursor:wait}
.load{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;min-height:1em}
@media (max-width:640px){.chip span{display:none}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.mk .ring{animation:none}}
</style>

<script type="module">
import * as THREE from './assets/three.module.min.js';

const REGIONS = [
  {code:'T1', city:'İzmir',          hazard:'Heatwave',        lat:38.42,  lon:27.14,   video:'video/izmir.mp4'},
  {code:'T2', city:'Los Angeles',    hazard:'Mega-drought',    lat:34.05,  lon:-118.24, video:'video/northamerica.mp4'},
  {code:'T3', city:'Rio de Janeiro', hazard:'Storm surge',     lat:-22.91, lon:-43.17,  video:'video/rio.mp4'},
  {code:'T4', city:'Moscow',         hazard:'Blizzard',        lat:55.76,  lon:37.62,   video:'video/moscow.mp4'},
  {code:'T5', city:'Copenhagen',     hazard:'Whiteout storm',  lat:55.68,  lon:12.57,   video:'video/copenhagen.mp4'},
  {code:'T6', city:'Shanghai',       hazard:'Mega-typhoon',    lat:31.23,  lon:121.47,  video:'video/shanghai.mp4'},
];

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const ss = (a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeIO = t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};

// ---------- renderer / scene ----------
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 200);
const HERO_DIST = 4.0, DIVE_DIST = 1.09;
let camDist = 8;            // starts far for the intro dolly
camera.position.set(0,0,camDist);

const globe = new THREE.Group();
globe.rotation.order = 'XYZ';
scene.add(globe);

const manager = new THREE.LoadingManager();
const loader = new THREE.TextureLoader(manager);
const loadEl = $('#load'), enterBtn = $('#enter');
manager.onProgress = (u,l,t)=>{ loadEl.textContent = `Loading the planet… ${Math.round(l/t*100)}%`; };
manager.onLoad = ()=>{ loadEl.textContent = 'Ready'; enterBtn.disabled = false; enterBtn.focus(); };

const tNight = loader.load('assets/earth-night.jpg');
const tWater = loader.load('assets/earth-water.jpg');
const tBump  = loader.load('assets/earth-bump.jpg');
const tCloud = loader.load('assets/earth-clouds.png');
for (const t of [tNight,tCloud]) { t.colorSpace = THREE.SRGBColorSpace; }
for (const t of [tNight,tWater,tBump,tCloud]) t.anisotropy = renderer.capabilities.getMaxAnisotropy();

const earthMat = new THREE.ShaderMaterial({
  uniforms:{ night:{value:tNight}, water:{value:tWater}, bump:{value:tBump}, dark:{value:0} },
  vertexShader:`
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.); vN=normalize(mat3(modelMatrix)*normal);
      vV=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`
    uniform sampler2D night, water, bump; uniform float dark;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      vec3 tex = texture2D(night,vUv).rgb;
      float w = texture2D(water,vUv).r;
      float warm = smoothstep(.01,.12, tex.r - tex.b*.55);
      vec3 base = tex*vec3(.55,.62,.75)*mix(1.,.55,w);
      vec3 glow = warm*vec3(1.,.70,.30)*3.4*(1.-dark);
      float fres = pow(1.-max(dot(vN,vV),0.),4.);
      vec3 col = base + glow + fres*vec3(.06,.13,.28);
      gl_FragColor = vec4(col,1.);
      #include <colorspace_fragment>
    }`
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(1,160,160), earthMat);
globe.add(earth);

const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(1.012,128,128),
  new THREE.MeshBasicMaterial({map:tCloud, transparent:true, opacity:.22, depthWrite:false, color:0x7f8ca3}));
globe.add(cloudMesh);

const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.2,96,96), new THREE.ShaderMaterial({
  side:THREE.BackSide, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  vertexShader:`varying vec3 vN; varying vec3 vP; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vP=mv.xyz; gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`varying vec3 vN; varying vec3 vP; void main(){ float i=pow(clamp(.62-dot(vN,vec3(0.,0.,1.)),0.,1.),3.); gl_FragColor=vec4(vec3(.28,.5,1.)*i*.85,1.); }`
}));
scene.add(atmo);

// stars
{
  const n=2600, g=new THREE.BufferGeometry(), p=new Float32Array(n*3), s=new Float32Array(n);
  for(let i=0;i<n;i++){ const u=Math.random()*2-1, th=Math.random()*Math.PI*2, r=60+Math.random()*30, q=Math.sqrt(1-u*u);
    p.set([r*q*Math.cos(th), r*u, r*q*Math.sin(th)], i*3); s[i]=Math.random(); }
  g.setAttribute('position', new THREE.BufferAttribute(p,3)); g.setAttribute('s', new THREE.BufferAttribute(s,1));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({transparent:true, depthWrite:false,
    uniforms:{t:{value:0}},
    vertexShader:`attribute float s; uniform float t; varying float a; void main(){ a=.25+.75*fract(s*7.)*(.6+.4*sin(t*1.3+s*40.)); gl_PointSize=1.+s*1.8; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`varying float a; void main(){ float d=length(gl_PointCoord-.5); gl_FragColor=vec4(vec3(.85,.9,1.),a*smoothstep(.5,.0,d)); }`})));
}

// ---------- geo ----------
function latLonToVec(lat,lon,r=1){
  const phi=(90-lat)*Math.PI/180, th=(lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(th));
}
function rotFor(lat,lon){ // globe rotation that brings (lat,lon) to face the camera
  const p=latLonToVec(lat,lon);
  return {yaw:Math.atan2(-p.x,p.z), pitch:lat*Math.PI/180};
}
const wrap = a => Math.atan2(Math.sin(a),Math.cos(a));

// ---------- markers / chips ----------
const marksEl=$('#marks'), chipsEl=$('#chips');
REGIONS.forEach((r,i)=>{
  r.pos = latLonToVec(r.lat,r.lon,1.005);
  const b=document.createElement('button'); b.className='mk'; b.setAttribute('aria-label',`${r.city} — ${r.hazard}`);
  b.innerHTML=`<span class="ring"></span><span class="ring r2"></span><span class="dot"></span><span class="lbl">${r.city}<small>${r.code} · ${r.hazard}</small></span>`;
  b.addEventListener('click',e=>{e.stopPropagation(); dive(i);});
  b.addEventListener('mouseenter',()=>chip(i,true)); b.addEventListener('mouseleave',()=>chip(i,false));
  marksEl.appendChild(b); r.el=b;
  const c=document.createElement('button'); c.className='chip'; c.innerHTML=`<b>${r.code}</b>${r.city}<span>${r.hazard}</span>`;
  c.addEventListener('click',()=>dive(i));
  c.addEventListener('mouseenter',()=>{chip(i,true); hoverTo=i;}); c.addEventListener('mouseleave',()=>{chip(i,false); hoverTo=-1;});
  chipsEl.appendChild(c); r.chip=c;
});
function chip(i,on){ REGIONS[i].el.classList.toggle('on',on); REGIONS[i].chip.classList.toggle('on',on); }
let hoverTo=-1;

// ---------- video player ----------
const player=$('#player');
REGIONS.forEach(r=>{ const v=document.createElement('video'); v.src=r.video; v.preload='auto'; v.playsInline=true; v.setAttribute('playsinline',''); player.appendChild(v); r.v=v; v.addEventListener('ended',()=>{ if(state==='video') exitDive(); }); });

// ---------- whoosh (procedural) ----------
let actx=null;
function whoosh(dur=2.4, delay=0, rise=.55){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const len=Math.floor(actx.sampleRate*dur), buf=actx.createBuffer(2,len,actx.sampleRate);
    for(let c=0;c<2;c++){ const d=buf.getChannelData(c); let b0=0,b1=0,b2=0;
      for(let i=0;i<len;i++){ const w=Math.random()*2-1; b0=.99765*b0+w*.0990460; b1=.96300*b1+w*.2965164; b2=.57000*b2+w*1.0526913; d[i]=(b0+b1+b2+w*.1848)*.11; } }
    const src=actx.createBufferSource(); src.buffer=buf;
    const f=actx.createBiquadFilter(); f.type='lowpass'; const g=actx.createGain(); const t0=actx.currentTime+delay;
    f.frequency.setValueAtTime(220,t0); f.frequency.exponentialRampToValueAtTime(1400,t0+dur*rise); f.frequency.exponentialRampToValueAtTime(300,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(.55,t0+dur*rise); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f).connect(g).connect(actx.destination); src.start(t0); src.stop(t0+dur+.05);
  }catch(e){}
}

// ---------- interaction ----------
let yaw=-0.6, pitch=0.32, vYaw=0, vPitch=0, dragging=false, lastX=0, lastY=0, idle=0;
let state='intro';     // intro | hero | diving | video | exiting
canvas.addEventListener('pointerdown',e=>{ if(state!=='hero')return; dragging=true; canvas.classList.add('drag'); lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!dragging)return; const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  const k=0.0052*(camDist/HERO_DIST); vYaw=dx*k; vPitch=dy*k; yaw+=vYaw; pitch=clamp(pitch+vPitch,-1.1,1.1); idle=0; });
const endDrag=()=>{ dragging=false; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{ if(state!=='hero')return; e.preventDefault(); zoomBias=clamp(zoomBias+e.deltaY*0.0012,-0.9,0.6); },{passive:false});
let zoomBias=0;
addEventListener('keydown',e=>{ if(e.key==='Escape' && state==='video') exitDive(); });

// ---------- cloud overlay ----------
const cl=[...document.querySelectorAll('#clouds img')], veil=$('#clouds .veil');
function setClouds(specs, v){
  specs.forEach((s,i)=>{ const L=cl[i]; L.style.opacity=s.o.toFixed(3); L.style.transform=`translate(calc(-50% + ${s.dx.toFixed(1)}px),-50%) scale(${s.s.toFixed(4)})`; });
  veil.style.opacity=v.toFixed(3);
}
const LAYERS=[{t0:.80,r:.95,s0:.95,din:.5,o0:1.90,o1:2.65,dx:0},{t0:.95,r:1.35,s0:.9,din:.45,o0:1.82,o1:2.50,dx:-.14},{t0:1.10,r:1.95,s0:.85,din:.4,o0:1.76,o1:2.30,dx:.17}];
function cloudsIn(t){ // dive timeline
  const specs=LAYERS.map(L=>{ if(t<L.t0) return {o:0,s:L.s0,dx:0};
    const s=L.s0*Math.exp(L.r*(t-L.t0)); return {o:ss(L.t0,L.t0+L.din,t)*(1-ss(L.o0,L.o1,t)), s, dx:L.dx*innerWidth*Math.max(s-1,0)}; });
  setClouds(specs, .95*ss(1.30,1.62,t)*(1-ss(1.75,2.25,t)));
}
const OUT=[{r:.95,a:.05,b:.55,c:1.35,d:2.15,dx:0},{r:1.35,a:.12,b:.62,c:1.25,d:1.95,dx:.14},{r:1.95,a:.2,b:.7,c:1.15,d:1.8,dx:-.17}];
function cloudsOut(t){ // exit timeline
  const specs=OUT.map(L=>{ const s=Math.exp(L.r*(1.0-t)); return {o:ss(L.a,L.b,t)*(1-ss(L.c,L.d,t)), s:Math.max(s,.75), dx:L.dx*innerWidth*Math.max(s-1,0)}; });
  setClouds(specs, .95*ss(.45,.82,t)*(1-ss(1.0,1.5,t)));
}

// ---------- dive / exit ----------
const ui=$('#ui'), back=$('#back'), bar=$('#bar'), barI=$('#bar i');
let anim=null, cur=-1;
function dive(i){
  if(state!=='hero') return;
  cur=i; const r=REGIONS[i]; state='diving';
  const v=r.v; v.currentTime=0; v.muted=false; const p=v.play(); if(p) p.then(()=>{ if(state==='diving'){ v.pause(); v.currentTime=0; } }).catch(()=>{});
  whoosh(2.6,.25,.6);
  const tgt=rotFor(r.lat,r.lon);
  anim={kind:'dive', t0:performance.now(), fromYaw:yaw, fromPitch:pitch, toYaw:yaw+wrap(tgt.yaw-yaw), toPitch:tgt.pitch, fromDist:camDist, shown:false};
  ui.classList.add('hide'); marksEl.classList.add('hide');
}
function showVideo(){
  const v=REGIONS[cur].v;
  REGIONS.forEach(r=>r.v.classList.toggle('cur', r===REGIONS[cur]));
  player.classList.add('show'); player.style.opacity='1';
  v.currentTime=0; v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
  back.classList.add('show'); bar.classList.add('show');
}
function exitDive(){
  if(state!=='video') return;
  state='exiting'; whoosh(2.4,0,.4);
  anim={kind:'exit', t0:performance.now(), swapped:false};
  back.classList.remove('show'); bar.classList.remove('show');
}
back.addEventListener('click',exitDive);

$('#enter').addEventListener('click',()=>{
  $('#intro').classList.add('gone');
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  // unlock all videos for later sound playback
  REGIONS.forEach(r=>{ const v=r.v; v.muted=true; const p=v.play(); if(p) p.then(()=>{v.pause(); v.currentTime=0; v.muted=false;}).catch(()=>{v.muted=false;}); });
  anim={kind:'intro', t0:performance.now()};
  whoosh(2.8,.1,.35);
});

// ---------- loop ----------
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w/h<0.8? 58:38; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const tmp=new THREE.Vector3(), camDir=new THREE.Vector3();
const sp1=document.getElementById('sp1'), sp2=document.getElementById('sp2'), sp3=document.getElementById('sp3'), gSpec=document.getElementById('gSpec');
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  scene.children.forEach(o=>{ if(o.material && o.material.uniforms && o.material.uniforms.t) o.material.uniforms.t.value=now/1000; });

  if(anim && anim.kind==='intro'){
    const t=(now-anim.t0)/1000, k=easeIO(t/2.6);
    camDist = 8 + (HERO_DIST-8)*k; yaw += dt*0.25*(1-k);
    if(t>=2.6){ anim=null; state='hero'; ui.classList.remove('hide'); marksEl.classList.remove('hide'); }
  } else if(anim && anim.kind==='dive'){
    const t=(now-anim.t0)/1000;
    const kr=easeIO(t/1.5), kz=easeIO(t/1.9);
    yaw=anim.fromYaw+(anim.toYaw-anim.fromYaw)*kr; pitch=anim.fromPitch+(anim.toPitch-anim.fromPitch)*kr;
    camDist=anim.fromDist+(DIVE_DIST-anim.fromDist)*kz;
    earthMat.uniforms.dark.value=0;
    cloudsIn(t);
    if(t>=1.6 && !anim.shown){ anim.shown=true; showVideo(); }
    if(anim.shown){ const u=t-1.6, z=1+0.12*(1-easeIO(u/1.4)); REGIONS[cur].v.style.transform=`scale(${z.toFixed(4)})`; }
    if(t>=2.8){ anim=null; state='video'; setClouds(LAYERS.map(()=>({o:0,s:1,dx:0})),0); }
  } else if(anim && anim.kind==='exit'){
    const t=(now-anim.t0)/1000;
    cloudsOut(t);
    if(t<0.95){ const v=REGIONS[cur].v; v.volume=clamp(1-t/0.9,0,1); }
    if(t>=0.95 && !anim.swapped){ anim.swapped=true; const v=REGIONS[cur].v; v.pause(); v.volume=1; player.classList.remove('show'); player.style.opacity='0'; camDist=DIVE_DIST*1.15; anim.d0=camDist; }
    if(anim.swapped){ const k=easeIO((t-0.95)/1.6); camDist=anim.d0+(HERO_DIST-anim.d0)*k; pitch += (0.32-pitch)*Math.min(dt*1.2,1)*k; }
    if(t>=2.4 && ui.classList.contains('hide')){ ui.classList.remove('hide'); marksEl.classList.remove('hide'); }
    if(t>=2.7){ anim=null; state='hero'; setClouds(OUT.map(()=>({o:0,s:1,dx:0})),0); zoomBias=0; }
  } else if(state==='hero'){
    if(!dragging){ yaw+=vYaw; pitch=clamp(pitch+vPitch,-1.1,1.1); vYaw*=.93; vPitch*=.93; idle+=dt;
      if(hoverTo>=0){ const tg=rotFor(REGIONS[hoverTo].lat,REGIONS[hoverTo].lon); yaw+=wrap(tg.yaw-yaw)*Math.min(dt*2.2,1); pitch+=(tg.pitch*.8-pitch)*Math.min(dt*2.2,1); }
      else if(idle>1.5 && !reduce) yaw+=dt*0.045; }
    camDist += (HERO_DIST*(1+zoomBias*.35)-camDist)*Math.min(dt*4,1);
  }

  globe.rotation.set(pitch,yaw,0);
  { // glass logo: the globe's light sweeps across it as the planet turns
    const ph = ((yaw*1.6 % 1) + 1) % 1;              // one sweep per ~0.6 rad of rotation
    const c = -0.35 + ph*1.7, w = 0.07;
    sp1.setAttribute('offset', clamp(c-w,0,1)); sp2.setAttribute('offset', clamp(c,0,1)); sp3.setAttribute('offset', clamp(c+w,0,1));
    sp2.setAttribute('stop-opacity', (c>-0.05 && c<1.05) ? .95 : 0);
    const warm = 0.5+0.5*Math.sin(yaw*1.3);           // tint shifts between city-light gold and atmosphere blue
    sp2.setAttribute('stop-color', `rgb(${Math.round(225+30*warm)},${Math.round(232+10*warm)},${Math.round(255-60*warm)})`);
    gSpec.setAttribute('x1', 10-8*Math.sin(pitch)); gSpec.setAttribute('x2', 78+8*Math.sin(pitch));
  }
  atmo.rotation.copy(globe.rotation);
  cloudMesh.rotation.y += dt*0.006;
  camera.position.set(0,0,camDist); camera.lookAt(0,0,0);

  // markers
  if(state==='hero' || state==='intro' || state==='diving'){
    camera.getWorldDirection(camDir);
    const W=innerWidth,H=innerHeight;
    for(const r of REGIONS){
      tmp.copy(r.pos).applyEuler(globe.rotation);
      const facing = tmp.clone().normalize().dot(tmp.clone().sub(camera.position).normalize().negate());
      tmp.project(camera);
      r.el.style.transform=`translate(${((tmp.x+1)/2*W).toFixed(1)}px,${((1-tmp.y)/2*H).toFixed(1)}px)`;
      r.el.classList.toggle('off', facing<0.12);
    }
  }
  if(state==='video' || (anim && anim.kind==='dive' && anim.shown)){ const v=REGIONS[cur].v; if(v.duration) barI.style.width=(v.currentTime/v.duration*100).toFixed(2)+'%'; }
  if(state==='exiting' && anim && anim.swapped) barI.style.width='0%';

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
